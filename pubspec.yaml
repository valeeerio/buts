name: buts
description: "Buts — app personale di tracciamento buste paga"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  file_selector: ^1.0.3
  syncfusion_flutter_pdf: ^27.2.5
  open_filex: ^4.5.0
  flutter_sticky_header: ^0.8.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

# Android non è un target funzionante di questo repo (la cartella android/
# non è versionata: manca AndroidManifest.xml/build.gradle, è uno stub
# incompleto locale) — vedi CLAUDE.md, "iOS come target primario". La
# generazione qui è quindi limitata a iOS. `adaptive_icon_*` restano
# configurati e pronti: se in futuro il progetto viene esteso ad Android
# (`flutter create --platforms=android .`), basta impostare `android: true`.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: false
  adaptive_icon_background: "#0B1016"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  # Font bundlati offline per lo stile "Pulse" (vedi CLAUDE.md, "Stile
  # visivo"): Space Grotesk (titoli/numeri/valori) + Inter (corpo/label).
  # Licenza SIL Open Font License, file in assets/fonts/ (vedi
  # assets/fonts/README.md per provenienza e come rigenerarli).
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpaceGrotesk-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
